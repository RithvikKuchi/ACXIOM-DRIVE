# Free web service. Use a Neon Free PostgreSQL database for durable data and keys.
services:
  - type: web
    name: acxiom-drive
    runtime: docker
    repo: https://github.com/RithvikKuchi/ACXIOM-DRIVE
    branch: main
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"
      - key: Hosting__RenderProxy
        value: "true"
      - key: Database__Provider
        value: PostgreSQL
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Authentication__AllowRegistration
        value: "false"
      - key: Bootstrap__Email
        sync: false
      - key: Bootstrap__Name
        value: Rithvik Administrator
      - key: Bootstrap__Password
        sync: false
