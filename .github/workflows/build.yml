name: Build and acceptance checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: python -m pip install -r tests/requirements.txt
      - name: Start app and execute HTTP acceptance checks
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development ConnectionStrings__DefaultConnection='Data Source=App_Data/ci.db' dotnet run -c Release --no-build --no-launch-profile --urls http://localhost:5081 > /tmp/acxiom.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:5081/Account/Login > /dev/null; then break; fi
            sleep 1
          done
          python tests/smoke_test.py --base http://localhost:5081 --output TestResults/results.json || { cat /tmp/acxiom.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: TestResults/results.json
